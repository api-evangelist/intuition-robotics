aid: intuition-robotics
name: Intuition Robotics
description: >-
  Intuition Robotics is a Tel Aviv-based AI company (with offices in the United States, Japan, and
  Greece) building social companion technology for older adults. Its flagship product, ElliQ, is an
  AI care companion robot that proactively engages users through natural conversation, body language,
  lights, and sound, powered by a proprietary "Relationship Orchestrator" cognitive-AI platform and
  multiple large language models to support health, wellness, cognitive engagement, and reducing
  loneliness. Intuition Robotics publishes no first-party developer API, SDK, or developer portal;
  the ElliQ product store (elliq.com, on Shopify) does expose an agent-commerce surface via the
  Universal Commerce Protocol (UCP), including a published llms.txt and a UCP shopping MCP endpoint
  for agent-driven catalog search and checkout. Backed by Bloomberg Beta among other investors.
